name: commits
on:
  pull_request:
jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validar mensagens
        run: |
          regex='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .{1,72}$'
          fail=0
          while IFS= read -r msg; do
            if ! [[ "$msg" =~ $regex ]]; then echo "Fora do padrão: $msg"; fail=1; fi
          done < <(git log --format=%s origin/${{ github.base_ref }}..HEAD --no-merges)
          exit $fail
