version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule: { interval: weekly }
    groups:
      laravel: { patterns: ["laravel/*", "illuminate/*"] }
      dev-tools: { dependency-type: development }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      vue:
        { patterns: ["vue", "vue-*", "@vue/*", "pinia", "vite", "@vitejs/*"] }
      testes:
        {
          patterns:
            [
              "vitest",
              "@vitest/*",
              "playwright*",
              "@playwright/*",
              "@axe-core/*",
            ],
        }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
