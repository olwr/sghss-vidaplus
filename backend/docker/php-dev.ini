; Xdebug: DESLIGADO por padrão (deixa a suíte e o Larastan lentos). XDEBUG_MODE (variável de ambiente) sobrescreve esta linha.
xdebug.mode=off
; Só depura quando a requisição/comando traz o gatilho XDEBUG_TRIGGER (evita tentar conectar a cada request)
xdebug.start_with_request=trigger
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.idekey=VSCODE

; pcov: cobertura de código com baixo custo; limitada à pasta app para não varrer vendor/
pcov.enabled=1
pcov.directory=/var/www/html/app

; Larastan e testes pedem mais memória
memory_limit=1G
