name: sghss

x-api: &api
  build:
    context: ./backend
    target: dev
    args: { UID: "${UID:-1000}", GID: "${GID:-1000}" }
  volumes: ["./backend:/var/www/html"]
  env_file:
    - path: ./backend/.env
      required: false
  environment: &api-env
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
  extra_hosts: ["host.docker.internal:host-gateway"] # o container alcança o VS Code (Xdebug, porta 9003)
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  api:
    <<: *api
    ports: ["8000:8080"]

  worker:
    <<: *api
    command: php artisan horizon
    restart: unless-stopped
    environment:
      <<: *api-env
      LOG_STACK: stderr_json

  scheduler:
    <<: *api
    command: php artisan schedule:work
    restart: unless-stopped
    environment:
      <<: *api-env
      LOG_STACK: stderr_json

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage: # S3-compatível (RustFS).
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
      RUSTFS_LOG_LEVEL: info
    volumes: ["storagedata:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck: # a imagem inclui curl e expõe /health (usado pelo stub do Laravel Sail)
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  storage-init: # cria os buckets privados e termina (o RustFS não traz cliente; usa-se o AWS CLI)
    image: amazon/aws-cli
    depends_on:
      storage: { condition: service_healthy }
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in sghss-private sghss-backups; do
          aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$b" 2>/dev/null \
            || aws --endpoint-url http://storage:9000 s3 mb "s3://$$b"
        done

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  web: # site MVP: Apache servindo o build estático do Vue (prova de conceito de produção)
    profiles: ["web"]
    build: { context: ./frontend, target: prod }
    ports: ["8081:8080"]

volumes: { pgdata: {}, redisdata: {}, storagedata: {} }
