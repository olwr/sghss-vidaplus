<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted

    # SPA: qualquer caminho que não seja arquivo existente cai no index.html (vue-router em modo history)
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]
</Directory>

# Cabeçalhos de segurança.
# CSP: scripts e estilos só do próprio site (sem 'unsafe-inline'/'unsafe-eval'); connect-src: só a API;
# frame-src: só o domínio Jitsi. Os marcadores __API_ORIGEM__ e __JITSI_ORIGEM__ são trocados no build da imagem.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' __API_ORIGEM__; frame-src __JITSI_ORIGEM__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
Header always set Permissions-Policy "camera=(self __JITSI_ORIGEM__), microphone=(self __JITSI_ORIGEM__), geolocation=()"
Header always set X-Frame-Options "DENY"
